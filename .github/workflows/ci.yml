name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # MinerU runs as a separate service; unit tests exercise the HTTP adapter only.
          sed '/^mineru\[pipeline\]/d' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install --index-url https://pypi.org/simple -r /tmp/requirements-ci.txt pytest

      - name: Run pytest
        env:
          PYTHONPATH: backend
        run: python -m pytest

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest with coverage gate
        run: npm run test:coverage

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint
